name: Daily Auto-Analyze (Vision-Backfill)

# Analysiert Crawler-Listings via Sophie-Vision-Pipeline (features[],
# Raum-Tags, Pro/Contra).
#
# Nur noch manuell (seit 2026-10-30): Der tägliche Lauf kostete ~45 $/Monat
# und schaffte nur ~2 % der aktiven Listings. Eigene Inserate analysiert der
# Owner selbst über den Dashboard-Button (/api/listings/[id]/analyze) —
# davon ist dieser Workflow unabhängig.
#
# Required GitHub Secrets:
#   - SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#   - ANTHROPIC_API_KEY

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Anzahl Listings (default 500)"
        required: false
        default: "500"
      model:
        description: "Vision-Modell"
        required: false
        default: "haiku"
        type: choice
        options:
          - haiku
          - sonnet

concurrency:
  group: analyze-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 500 listings × ~3s Vision-Call / concurrency 3 ≈ 500s (~9 min).
    # Bei Backlog (Erstlauf nach Deploy) deutlich mehr — 120 min ist
    # GH-Free-Tier-freundlich und reicht für ~2k Listings.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run analyze batch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --import tsx scripts/analyze-listings-batch.ts \
            --filter all_unanalyzed \
            --limit "${{ inputs.limit || '500' }}" \
            --model "${{ inputs.model || 'haiku' }}" \
            --concurrency 3
