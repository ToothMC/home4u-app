name: Daily Bazaraki Crawl

# runs-on: mac-mini (NICHT ubuntu-latest). Bazaraki liegt hinter Cloudflare,
# und CF sperrt Datacenter-IPs: von einem GitHub-Hosted-Runner kam nicht die
# echte Seite, sondern eine Challenge (dokumentiert in
# probe-bazaraki-dom.yml, das deshalb von Anfang an self-hosted lief). Ein
# Crawler ohne Payload findet 0 Items — und 0 Items ist seit Commit 8c4f2a0
# exit 1. Grüner Build, roter Lauf. Der mac-mini hat eine Cyta-Residential-IP.
# Dasselbe gilt für cdn1.bazaraki.com, das der pHash und der Cover-Breiten-
# Check brauchen (siehe media-check-daily.yml).
#
# Kein Playwright mehr: Bazaraki rendert seit Juni 2026 client-seitig (Next.js
# App Router), die Inserate stehen im RSC-Flight-Payload des HTML statt im
# DOM. httpx genügt für Liste UND Detail — siehe bazaraki-crawler/src/flight.py.

on:
  schedule:
    # 4× täglich alle 6h (00, 06, 12, 18 UTC). Pro Lauf max 90min Wall-Clock
    # via MAX_RUNTIME_S; Streaming-Architektur persistiert nach jedem Subtype.
    # Mehrere kürzere Läufe statt ein 5h-Marathon: jeder grün, Daten landen
    # inkrementell, kein Datenverlust bei Job-Cancel.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      cities:
        description: "Cities-Filter (kommagetrennt, leer = alle)"
        required: false
        default: ""
      types:
        description: "rent,sale (leer = beide)"
        required: false
        default: ""
      max_pages:
        description: "Max Pages pro City+Type"
        required: false
        default: "60"
      max_runtime_s:
        description: "Wall-Clock-Budget in Sekunden (default 5400 = 90min)"
        required: false
        default: "5400"
      dry_run:
        description: "Nur loggen, kein DB-Write"
        type: boolean
        required: false
        default: false
      skip_details:
        description: "Detail-Page-Drilling überspringen (5x schneller, ohne district/m²/Galerie)"
        type: boolean
        required: false
        default: false
      force_full_drill:
        description: "Auch bereits gedrillte Listings nochmal drillen (Reparatur-Lauf)"
        type: boolean
        required: false
        default: false
      redrill_below_media:
        description: "Smart-Backfill: nur Listings re-drillen mit weniger als N Bildern (0 = aus). Nutze mit force_full_drill=true."
        required: false
        default: "0"
      backfill_drill_queue:
        description: "Standalone-Backfill: skip Pass 1, lade dünne Listings direkt aus DB via source_url und drille nur. Schließt Lücken die der reguläre Cron nicht mehr trifft."
        type: boolean
        required: false
        default: false
      backfill_threshold:
        description: "Backfill: media-Länge unter der re-drilled wird (default 3, nur mit backfill_drill_queue=true)"
        required: false
        default: "3"
      backfill_limit:
        description: "Backfill: Max Listings pro Run (0 = unbegrenzt, Watchdog greift dann)"
        required: false
        default: "0"

concurrency:
  group: bazaraki-crawl
  cancel-in-progress: false

jobs:
  crawl:
    # Pinned auf mac-mini Label, nicht generisch "self-hosted" — wie bsc-daily.
    runs-on: [self-hosted, mac-mini]
    # Script self-stoppt via MAX_RUNTIME_S (Default 5400s = 90min), das hier
    # ist nur Safety-Net. Mit 350min können Backfill-Läufe (workflow_dispatch
    # mit max_runtime_s=20000, ~5h) denselben Workflow nutzen.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ./bazaraki-crawler
    steps:
      - uses: actions/checkout@v5

      - name: Setup venv + deps
        # MacMini hat Python 3.11 via Homebrew. Eigene venv pro Run statt
        # System-Site-Packages, sonst kollidieren parallele Branches.
        run: |
          /opt/homebrew/bin/python3.11 -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install -e . --quiet

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CITIES: ${{ inputs.cities }}
          TYPES: ${{ inputs.types }}
          MAX_PAGES_PER_CITY: ${{ inputs.max_pages || '60' }}
          MAX_RUNTIME_S: ${{ inputs.max_runtime_s || '5400' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SKIP_DETAILS: ${{ inputs.skip_details && '1' || '' }}
          FORCE_FULL_DRILL: ${{ inputs.force_full_drill && '1' || '' }}
          REDRILL_BELOW_MEDIA: ${{ inputs.redrill_below_media || '0' }}
          BACKFILL_DRILL_QUEUE: ${{ inputs.backfill_drill_queue && '1' || '' }}
          BACKFILL_THRESHOLD: ${{ inputs.backfill_threshold || '3' }}
          BACKFILL_LIMIT: ${{ inputs.backfill_limit || '0' }}
        run: .venv/bin/python -m src.main
