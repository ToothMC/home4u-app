name: Probe Bazaraki DOM

# Diagnose-Workflow: holt eine Bazaraki-URL und druckt, was im RSC-Flight-
# Payload steht — bei einer Listenseite die adverts, bei einer Detailseite die
# Galerie-Varianten samt gemessener Bildbreite. Damit lässt sich nachvollziehen,
# woher ein 160px-Thumbnail in media[0] kommt, ohne den Produktiv-Crawler
# anzufassen. Braucht keinen Browser mehr (siehe bazaraki-crawler/src/flight.py).

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bazaraki-URL — Detail (/adv/…) oder Listenseite"
        required: true

jobs:
  probe:
    # Self-hosted mac-mini hat Cyta-CY residential IP — Bazaraki liefert die
    # echte Detail-Page ohne CF-Challenge. Ubuntu-latest hat geblockt.
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./bazaraki-crawler
    steps:
      - uses: actions/checkout@v5

      - name: Setup venv + deps
        run: |
          /opt/homebrew/bin/python3.11 -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install -e . --quiet

      - name: Run RSC payload probe
        run: .venv/bin/python -m src.probe_dom "${{ inputs.url }}"
