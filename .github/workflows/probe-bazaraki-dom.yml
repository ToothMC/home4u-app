name: Probe Bazaraki DOM

# Diagnose-Workflow: öffnet eine konkrete Bazaraki-Detail-URL via Playwright
# und druckt für jeden Crawler-Selektor (JSON-LD, gallery img, bg-image, ...)
# die gefundenen URLs. Damit lässt sich nachvollziehen, woher ein Logo in
# media[0] kommt, ohne den Produktiv-Crawler zu modifizieren.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bazaraki-Detail-URL (z.B. https://www.bazaraki.com/adv/6489011/)"
        required: true

jobs:
  probe:
    # ubuntu-latest reicht für Diagnose-Single-Request — Bazaraki blockt
    # Datacenter-IPs nicht hart für simple Page-Loads (anders als BSC). Falls
    # doch 403: auf [self-hosted, mac-mini] umschalten.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./bazaraki-crawler
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run DOM probe
        run: python -m src.probe_dom "${{ inputs.url }}"
